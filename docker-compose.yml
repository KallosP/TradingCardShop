services:
  frontend:
    build: client
    ports:
      - "5173:5173"
    networks:
      - tcs-network
  backend:
    build: server
    ports:
      - "5050:5050"
    networks:
      - tcs-network
    depends_on:
      - db
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - tcs-network
    volumes:
      - mongo-data:/data/db

networks:
  tcs-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local